<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded squircle gradient (optional, subtle) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Rost Rust Orange gradients -->
    <linearGradient id="rustPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f4a" />
      <stop offset="50%" stop-color="#e55f28" />
      <stop offset="100%" stop-color="#b53900" />
    </linearGradient>

    <linearGradient id="braceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb07a" />
      <stop offset="50%" stop-color="#f2692e" />
      <stop offset="100%" stop-color="#c43f05" />
    </linearGradient>

    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffb68f" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#e55f28" flood-opacity="0.3" />
    </filter>
  </defs>

