name: CI

on:
  push:
    branches: [main, sprints]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features serde", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }}
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  demo:
    name: demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Generates the demo project against this checkout, then drives its terminal UI:
      # live edit, rejected edit, `t` patching app.rost, clean exit.
      - run: scripts/rost-init.sh "$RUNNER_TEMP/demo"
      - run: python3 scripts/demo-test.py "$RUNNER_TEMP/demo"

  perf:
    name: perf gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # Base and head are built in the same job and measured in executed instructions
      # (valgrind), which do not vary with the machine. Fails if any workload executes
      # more than 3% more instructions than the base.
      - run: scripts/perf-gate.sh "origin/${{ github.base_ref }}" 3
