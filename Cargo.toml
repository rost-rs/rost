[package]
name = "rost"
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["The Rost Project Contributors"]
description = "Blazing-fast zero-copy document parser, indexer, and malleable engine for the .rost format"
license = "MIT"
repository = "https://github.com/rost-rs/rost"

[dependencies]
arc-swap = { version = "1", optional = true }
memchr = "2.8.3"
memmap2 = { version = "0.9", optional = true }
notify = { version = "8", optional = true }
rost-derive = { path = "rost-derive", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
# `Template::mmap_rostc`: load precompiled documents straight from a memory map.
mmap = ["dep:memmap2"]
# `#[derive(Rost)]` and `rost::load`: generated loaders that skip serde's visitor protocol.
derive = ["serde", "dep:rost-derive"]
# `Reloader<T>`: typed live values driven by filesystem events.
watch = ["dep:notify", "dep:arc-swap"]

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
simd-json = "0.19.0"
sonic-rs = "0.5.10"
toml = "0.9"

[[bench]]
name = "compare"
harness = false
required-features = ["serde"]

[profile.bench]
codegen-units = 1
lto = "fat"

[[bench]]
name = "corpus"
harness = false
required-features = ["serde"]

[[example]]
name = "live_theme"
required-features = ["derive", "watch"]

[[bench]]
name = "gate"
harness = false
required-features = ["serde"]
